name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          make test

      - name: Run ruff check
        run: |
          make lint || (echo "--- ruff check failed ---" && exit 1)

      - name: Run mypy (advisory)
        # mypy --strict is enforced in typecheck.yml (nightly).
        # Here we run it as advisory so PRs aren't blocked by existing type gaps.
        # TODO TASK-148: graduate to blocking once type-hint coverage >85%.
        run: |
          mypy shared servers --ignore-missing-imports || echo "mypy advisory: non-blocking"

  build:
    name: build sanity
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --wheel --outdir dist/
      - name: Verify entrypoints
        run: |
          pip install dist/*.whl
          python -c "import importlib.metadata as m; print('entrypoints:', [ep.name for ep in m.entry_points()['console_scripts'] if 'mcp-' in ep.name])"
