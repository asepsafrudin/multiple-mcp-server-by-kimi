name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: workflow lint (actionlint + schema)
    runs-on: ubuntu-latest
    env:
      # Turn "actionlint could not run" into a failure instead of a silent
      # skip, so this gate can never quietly disappear from the pipeline.
      ACTIONLINT_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6.0"

      - name: Validate workflow YAML (deterministic checks)
        run: python scripts/validate_workflows.py

      - name: Run actionlint (semantic checks)
        # Uses the version-pinned rhysd/actionlint Docker image via
        # scripts/run_actionlint.sh. The same command runs locally with
        # `make ci-lint`, so a green local run means a green CI job.
        run: bash scripts/run_actionlint.sh

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        # `make test` resolves the interpreter through the Makefile fallback, so
        # it works both locally (.venv present) and in CI (runner Python).
        run: make test

      - name: Run ruff (check + format)
        run: make lint

      - name: Run mypy (advisory)
        # mypy --strict is tracked in typecheck.yml (advisory until TASK-148).
        # Advisory here too, so PRs are not blocked by pre-existing type gaps.
        run: |
          mypy shared servers --ignore-missing-imports || echo "mypy advisory - non-blocking"

  build:
    name: build sanity
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --wheel --outdir dist/

      - name: Verify installed entrypoints
        # Previously this used entry_points()['console_scripts'], which raises
        # KeyError on Python 3.12 (the selectable-groups dict API was removed).
        # The group= keyword is the supported API on Python 3.10+.
        run: |
          pip install --no-deps dist/*.whl
          python - <<'PY'
          import importlib.metadata as m

          expected = {
              "mcp-core-server",
              "mcp-memory-server",
              "mcp-knowledge-server",
              "mcp-skills-server",
              "mcp-gmail-bridge",
              "mcp-telegram-bridge",
              "mcp-gemini-bridge",
              "mcp-vision-bridge",
              "mcp-mikrotik-bridge",
              "mcp-orchestrator",
              "mcp-decision-server",
              "mcp-document-server",
          }
          got = {
              e.name
              for e in m.entry_points(group="console_scripts")
              if e.name.startswith("mcp-")
          }
          print("expected:", sorted(expected))
          print("got     :", sorted(got))
          missing = expected - got
          assert not missing, f"missing entrypoints: {sorted(missing)}"
          print("OK - all 12 console scripts are registered")
          PY