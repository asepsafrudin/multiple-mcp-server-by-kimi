name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        # `make test` resolves the interpreter via the Makefile fallback so it
        # works both locally (.venv) and in CI (runner Python).
        run: make test

      - name: Run ruff (check + format)
        run: make lint

      - name: Run mypy (advisory)
        # mypy --strict is tracked in typecheck.yml (advisory until TASK-148).
        # Advisory here so PRs are not blocked by pre-existing type gaps.
        run: mypy shared servers --ignore-missing-imports || echo "mypy advisory: non-blocking"

  build:
    name: build sanity
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --wheel --outdir dist/

      - name: Verify installed entrypoints
        # Previously this used entry_points()['console_scripts'], which raises
        # KeyError on Python 3.12 (the selectable-groups dict API was removed).
        # The group= keyword is the supported API on 3.10+.
        run: |
          pip install --no-deps dist/*.whl
          python -c "import importlib.metadata as m; eps = sorted(e.name for e in m.entry_points(group='console_scripts') if e.name.startswith('mcp-')); print('entrypoints:', eps); assert len(eps) >= 12, f'expected >=12 mcp- entrypoints, got {len(eps)}'"