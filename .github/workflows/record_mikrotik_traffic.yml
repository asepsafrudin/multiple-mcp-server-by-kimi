name: Record MikroTik Traffic

on:
  schedule:
    # 11:00 UTC == 18:00 WIB (6 PM WIB) | Monday through Friday (5 days a week)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows manual triggering from GitHub interface

jobs:
  run-recorder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Create .env from Secret
        run: |
          python -c "
          import os
          data = os.environ.get('SECRET_DATA', '')
          if data:
              with open('.env', 'w') as f:
                  if '=' in data:
                      f.write(data)
                  else:
                      f.write(f'MIKROTIK_PASSWORD={data}\n')
          else:
              # Create .env from individual secrets/variables if MIKROTIK is empty
              with open('.env', 'w') as f:
                  f.write(f'MIKROTIK_HOST={os.environ.get(\"MIKROTIK_HOST\", \"\")}\n')
                  f.write(f'MIKROTIK_PORT={os.environ.get(\"MIKROTIK_PORT\", \"\")}\n')
                  f.write(f'MIKROTIK_SCHEME={os.environ.get(\"MIKROTIK_SCHEME\", \"\")}\n')
                  f.write(f'MIKROTIK_USER={os.environ.get(\"MIKROTIK_USER\", \"\")}\n')
                  f.write(f'MIKROTIK_PASSWORD={os.environ.get(\"MIKROTIK_PASSWORD\", \"\")}\n')
                  f.write(f'MIKROTIK_SSH_PORT={os.environ.get(\"MIKROTIK_SSH_PORT\", \"\")}\n')
          "
        env:
          MIKROTIK_HOST: ${{ secrets.MIKROTIK_HOST || vars.MIKROTIK_HOST }}
          MIKROTIK_PORT: ${{ secrets.MIKROTIK_PORT || vars.MIKROTIK_PORT }}
          MIKROTIK_SCHEME: ${{ secrets.MIKROTIK_SCHEME || vars.MIKROTIK_SCHEME }}
          MIKROTIK_USER: ${{ secrets.MIKROTIK_USER || vars.MIKROTIK_USER }}
          MIKROTIK_PASSWORD: ${{ secrets.MIKROTIK_PASSWORD }}
          MIKROTIK_SSH_PORT: ${{ secrets.MIKROTIK_SSH_PORT || vars.MIKROTIK_SSH_PORT }}
          SECRET_DATA: ${{ secrets.MIKROTIK }}

      - name: Debug Connection to MikroTik
        run: |
          echo "=== DNS Resolution ==="
          nslookup idn23.tunnel.id || true
          ping -c 3 idn23.tunnel.id || true
          echo "=== Port 3227 (API) ==="
          curl -k -I --connect-timeout 5 https://idn23.tunnel.id:3227/rest/interface || true
          echo "=== Port 3228 (SSH) ==="
          nc -zv -w 5 idn23.tunnel.id 3228 || true

      - name: Record Traffic Statistics
        env:
          MIKROTIK_TLS_VERIFY: 'false'
        run: |
          mkdir -p logs
          # Record ether5 (ISP WAN) traffic at 10s intervals for 3 hours (10800s)
          python scripts/record_interface_traffic.py --interface ether5 --interval 10 --duration 10800

      - name: Commit and Push CSV Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/
          # Only commit and push if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-record traffic: $(date +'%Y-%m-%d')" && git push)
