name: Record MikroTik Traffic

on:
  schedule:
    # 11:00 UTC == 18:00 WIB (6 PM WIB) | Monday through Friday (5 days a week)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows manual triggering from GitHub interface

jobs:
  run-recorder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Create .env from Secret
        run: |
          if [ -n "${{ secrets.MIKROTIK }}" ]; then
            if [[ "${{ secrets.MIKROTIK }}" == *"="* ]]; then
              echo "${{ secrets.MIKROTIK }}" > .env
            else
              echo "MIKROTIK_PASSWORD=${{ secrets.MIKROTIK }}" > .env
            fi
          else
            echo "MIKROTIK_HOST=${{ secrets.MIKROTIK_HOST || vars.MIKROTIK_HOST }}" >> .env
            echo "MIKROTIK_PORT=${{ secrets.MIKROTIK_PORT || vars.MIKROTIK_PORT }}" >> .env
            echo "MIKROTIK_SCHEME=${{ secrets.MIKROTIK_SCHEME || vars.MIKROTIK_SCHEME }}" >> .env
            echo "MIKROTIK_USER=${{ secrets.MIKROTIK_USER || vars.MIKROTIK_USER }}" >> .env
            echo "MIKROTIK_PASSWORD=${{ secrets.MIKROTIK_PASSWORD }}" >> .env
            echo "MIKROTIK_SSH_PORT=${{ secrets.MIKROTIK_SSH_PORT || vars.MIKROTIK_SSH_PORT }}" >> .env
          fi

      - name: Record Traffic Statistics
        env:
          MIKROTIK_TLS_VERIFY: 'false'
        run: |
          mkdir -p logs
          # Record ether5 (ISP WAN) traffic at 10s intervals for 3 hours (10800s)
          python scripts/record_interface_traffic.py --interface ether5 --interval 10 --duration 10800

      - name: Commit and Push CSV Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/
          # Only commit and push if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-record traffic: $(date +'%Y-%m-%d')" && git push)
