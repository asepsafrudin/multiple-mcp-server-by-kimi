name: Typecheck

on:
  schedule:
    # Nightly at 03:00 UTC (10:00 WIB) to catch type drift early.
    - cron: "0 3 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy --strict (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy --strict
        # Non-blocking on purpose. Strict mode ([tool.mypy] strict = true) has
        # ~125 pre-existing errors in the codebase; a permanently-red required
        # check is worse than no check. TASK-148 burns the errors down, after
        # which this step becomes a blocking gate.
        continue-on-error: true
        run: |
          set -o pipefail
          mypy shared servers 2>&1 | tee /tmp/mypy.log || true
          # Grouped redirect instead of one `>>` per line (actionlint SC2129).
          {
            echo "### mypy --strict (advisory — see TASK-148)"
            echo '```'
            tail -n 1 /tmp/mypy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"